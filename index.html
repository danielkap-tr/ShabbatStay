<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shabbat Stay Recommendations</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div>
      <h1>Shabbat Stay</h1>
      <p>דירות ומלונות מומלצים לשבת בחו"ל ובערים אחרות.</p>
    </div>
  </header>

  <main>
  <div class="page-grid">
    <section class="panel panel-filters">
      <h2>סינונים</h2>
      <div class="filter-group">
        <label for="searchInput">חיפוש שם או כתובת</label>
        <input id="searchInput" type="text" placeholder="חיפוש" />
      </div>
      <div class="filter-group">
        <label for="countrySelect">מדינה</label>
        <select id="countrySelect">
          <option value="">הכל</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="citySelect">עיר</label>
        <select id="citySelect">
          <option value="">הכל</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="kosherSelect">ציון כשרות מינימלי</label>
        <select id="kosherSelect">
          <option value="0">הכל</option>
          <option value="1">≥ 1</option>
          <option value="2">≥ 2</option>
          <option value="3">≥ 3</option>
          <option value="4">≥ 4</option>
          <option value="5">5</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="ratingSelect">ציון כללי מינימלי</label>
        <select id="ratingSelect">
          <option value="0">הכל</option>
          <option value="1">≥ 1</option>
          <option value="2">≥ 2</option>
          <option value="3">≥ 3</option>
          <option value="4">≥ 4</option>
          <option value="5">5</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="shabbatSelect">מתאים לשבת</label>
        <select id="shabbatSelect">
          <option value="">הכל</option>
          <option value="yes">כן</option>
          <option value="no">לא</option>
        </select>
      </div>
    </section>

    <section class="panel panel-listings">
      <h2>המלצות</h2>
      <div id="listingContainer" class="listing-grid"></div>
    </section>

    <section class="panel panel-form">
      <h2>הוסף המלצה</h2>
      <form id="reviewForm">
        <div class="form-row">
          <label for="nameInput">שם המקום</label>
          <input id="nameInput" type="text" required />
        </div>
        <div class="form-row">
          <label for="addressInput">כתובת</label>
          <input id="addressInput" type="text" required />
        </div>
        <div class="form-row">
          <label for="ownerInput">פרטי בעלים / יצירת קשר</label>
          <input id="ownerInput" type="text" placeholder="שם, טלפון או אימייל" />
        </div>
        <div class="form-row">
          <label for="isOwnerInput">אני הבעלים/ת ונרשם/ת ישירות כמארח/ת</label>
          <input id="isOwnerInput" type="checkbox" />
        </div>
        <div class="form-row half">
          <label for="capacityInput">מספר אורחים/מיטות</label>
          <input id="capacityInput" type="number" min="1" placeholder="לדוגמה: 4" />
        </div>
        <div class="form-row half">
          <label for="priceInput">מחיר ללילה</label>
          <input id="priceInput" type="number" min="0" step="any" placeholder="בש״ח" />
        </div>
        <div class="form-row">
          <label for="contactInput">טלפון/אימייל ליצירת קשר (למארחים)</label>
          <input id="contactInput" type="text" placeholder="050-1234567 או email@example.com" />
        </div>
        <div class="form-row">
          <label for="countryInput">מדינה</label>
          <input id="countryInput" type="text" required />
        </div>
        <div class="form-row">
          <label for="cityInput">עיר</label>
          <input id="cityInput" type="text" required />
        </div>
        <div class="form-row half">
          <label for="ratingInput">ציון כללי</label>
          <select id="ratingInput" required>
            <option value="5">5</option>
            <option value="4">4</option>
            <option value="3">3</option>
            <option value="2">2</option>
            <option value="1">1</option>
          </select>
        </div>
        <div class="form-row half">
          <label for="kosherInput">ציון כשרות</label>
          <select id="kosherInput" required>
            <option value="5">5</option>
            <option value="4">4</option>
            <option value="3">3</option>
            <option value="2">2</option>
            <option value="1">1</option>
          </select>
        </div>
        <div class="form-row">
          <label for="shabbatInput">מתאים לשבת?</label>
          <select id="shabbatInput" required>
            <option value="yes">כן</option>
            <option value="no">לא</option>
          </select>
        </div>
        <div class="form-row">
          <label for="descriptionInput">תיאור התאמה לשבת</label>
          <textarea id="descriptionInput" rows="4" placeholder="מה יש במקום? האם מוכנים להתאים לשבת?" required></textarea>
        </div>
        <button type="submit" class="btn-primary">שלח המלצה</button>
      </form>
    </section>
  </div>

  <section class="guests-section">
    <h2>אורחים מחפשים אירוח</h2>
    <div class="guests-grid">
      <div class="panel panel-guest-listings">
        <h3>בקשות פתוחות</h3>
        <div id="guestRequestContainer" class="listing-grid"></div>
      </div>
      <div class="panel panel-guest-form">
        <h3>פרסם בקשת אירוח</h3>
        <form id="guestRequestForm">
          <div class="form-row">
            <label for="guestNameInput">שם</label>
            <input id="guestNameInput" type="text" required />
          </div>
          <div class="form-row">
            <label for="guestContactInput">טלפון/אימייל ליצירת קשר</label>
            <input id="guestContactInput" type="text" required placeholder="050-1234567 או email@example.com" />
          </div>
          <div class="form-row half">
            <label for="guestFamilySizeInput">מספר אנשים במשפחה</label>
            <input id="guestFamilySizeInput" type="number" min="1" required />
          </div>
          <div class="form-row half">
            <label for="guestKosherInput">רמת כשרות נדרשת</label>
            <select id="guestKosherInput" required>
              <option value="5">5</option>
              <option value="4">4</option>
              <option value="3">3</option>
              <option value="2">2</option>
              <option value="1">1</option>
            </select>
          </div>
          <div class="form-row">
            <label for="guestCountryInput">מדינה מבוקשת</label>
            <input id="guestCountryInput" type="text" required />
          </div>
          <div class="form-row">
            <label for="guestCityInput">עיר מבוקשת</label>
            <input id="guestCityInput" type="text" required />
          </div>
          <div class="form-row">
            <label for="guestDateInput">תאריך/ים מבוקש</label>
            <input id="guestDateInput" type="text" required placeholder="לדוגמה: פרשת בשלח, 30/1" />
          </div>
          <button type="submit" class="btn-primary">פרסם בקשה</button>
        </form>
      </div>
    </div>
  </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
